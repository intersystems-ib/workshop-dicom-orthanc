services:
  orthanc:
    image: orthancteam/orthanc
    command: /run/secrets/  # Path to the configuration files (stored as secrets)
    ports:
      - 4242:4242
      - 8042:8042
    secrets:
      - orthanc.json
    environment:
      - ORTHANC_NAME=orthanc
    volumes:
      - /tmp/orthanc-db/:/var/lib/orthanc/db/
      - ./shared:/shared:ro
    hostname: orthanc
  iris:
    container_name: iris
    build:
      context: .
      dockerfile: iris/Dockerfile
    ports:
    - "52774:52773"
    - "2010:2010"
    - "23:2323"
    - "1972:1972"
    volumes:
    - ./shared:/shared
    command: 
      --check-caps false
      --ISCAgent false
    hostname: iris
    environment:
    - ISC_DATA_DIRECTORY=/shared/durable/data
secrets:
  orthanc.json:
    file: orthanc.json
